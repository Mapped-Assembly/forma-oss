name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/forma-gui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build tools
        run: python -m pip install build twine
      - name: Build Python distribution
        run: python -m build --outdir python-dist
      - name: Check Python distribution metadata
        run: python -m twine check python-dist/*
      - name: Run npm package checks
        working-directory: packages/forma-gui
        run: npm ci && npm test
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python-dist/

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/forma-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/forma-gui/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Publish npm package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python-dist/
      - name: Publish Python distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
          skip-existing: true
