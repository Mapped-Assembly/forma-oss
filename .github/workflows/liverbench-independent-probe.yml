name: LiverBench independent biology probe

on:
  pull_request:
    paths:
      - "scripts/liverbench_probe_dilimap.py"
      - ".github/workflows/liverbench-independent-probe.yml"

permissions:
  contents: read

jobs:
  probe-dilimap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "DILImap @ git+https://github.com/Cellarity/DILImap.git@main"
      - run: python scripts/liverbench_probe_dilimap.py
