name: Fluidic and biological experiment interface

on:
  pull_request:
    paths:
      - "forma_core/**"
      - "apps/api/a2a.py"
      - "apps/api/opencode_mcp.py"
      - "examples/organ-on-chip/**"
      - "examples/fluidics/**"
      - "examples/biology/**"
      - "tests/projects/test_fluidics*.py"
      - "tests/projects/test_biology.py"
      - "tests/projects/test_liverbench.py"
      - "tests/projects/test_liverbench_baselines.py"
      - "tests/projects/test_liverbench_independent.py"
      - "tests/projects/test_liverbench_assay.py"
      - "tests/agents/test_generation_stages.py"
      - "tests/agents/test_validation_worker.py"
      - "tests/opencode/test_mcp.py"
      - ".github/workflows/fluidics.yml"

permissions:
  contents: read

jobs:
  fluidics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/api/requirements.txt -e . pytest
      - run: python -m pytest tests/projects/test_fluidics.py tests/projects/test_biology.py tests/projects/test_liverbench.py tests/projects/test_liverbench_baselines.py tests/projects/test_liverbench_independent.py tests/projects/test_liverbench_assay.py tests/projects/test_component_instances.py tests/agents/test_generation_stages.py tests/agents/test_validation_worker.py tests/opencode/test_mcp.py -q
      - run: python -m forma_core.fluidics.benchmark examples/organ-on-chip/two-channel.json --spec examples/organ-on-chip/two-channel-spec.json
      - run: python -m forma_core.fluidics.benchmark examples/fluidics/liquid-transfer.json --spec examples/fluidics/liquid-transfer-spec.json
      - run: python -m forma_core.biology.benchmark examples/organ-on-chip/liver-dili-biological.json --project examples/organ-on-chip/two-channel.json
      - run: python -m forma_core.biology.liverbench examples/biology/liverbench-v0.json --project examples/organ-on-chip/two-channel.json
      - run: python -m forma_core.biology.liverbench_baselines examples/biology/liverbench-v0.json --baseline dilirank-severity-v0 --split heldout
      - run: python -m forma_core.biology.liverbench examples/biology/liverbench-v0.json --predictions examples/biology/liverbench-v0-dilirank-severity-baseline.json --split heldout
      - run: python -m forma_core.biology.liverbench_independent examples/biology/liverbench-v0.json examples/biology/liverbench-v0-pubchem-descriptors.json
